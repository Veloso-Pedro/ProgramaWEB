<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function botaoTexto() {
            var p = document.getElementById('p')

            if (p.style.visibility === 'visible'){
                p.style.visibility = 'hidden'
            }else{
                p.style.visibility = 'visible'
            }
            
        }
    </script>
</head>
<body>
    <p id="p">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Tempore enim suscipit ab porro eius, vero hic nihil consequatur molestiae corporis, qui laudantium similique consequuntur. Vel nemo quis ab vitae culpa.</p>
    <button onclick="botaoTexto()">Botao</button>
</body>
</html>
